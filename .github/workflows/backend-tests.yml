name: backend-tests

on:
  push:
    paths:
      - "Database & Backend Development Team/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "Database & Backend Development Team/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Database & Backend Development Team/backend"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricematch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Database & Backend Development Team/backend/requirements.txt"
      - run: pip install -r requirements.txt
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pricematch_test
        run: pytest -q
